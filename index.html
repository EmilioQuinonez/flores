<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Un florero para Mafer — opción 3</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="florero.css" />
    </head>
    <body>
        <div class="scene">
            <div class="glow glow--1"></div>
            <div class="glow glow--2"></div>
            <div class="glow glow--3"></div>

            <header>
                <p class="subtitle">
                    No creo que lo veas, pero de todas maneras las hago para ti.
                </p>
            </header>

            <div class="arrangement">
                <div class="vase"></div>

                <div
                    class="leaf3"
                    style="bottom: 142px; --base-x: -10px; --tilt: -22deg"
                ></div>
                <div
                    class="leaf3"
                    style="bottom: 142px; --base-x: 8px; --tilt: 20deg"
                ></div>

                <!-- Hojas de lirios y tulipanes: van aparte, al fondo del ramo.
                     Comparten --tilt, --base-x y --sway-delay con su flor para
                     moverse igual que ella. -->
                <div
                    class="lily lily--back"
                    style="
                        --stem-h: 155px;
                        --tilt: -8deg;
                        --base-x: -14px;
                        --layer: 0;
                        --sway-delay: -3s;
                    "
                >
                    <div class="lily__leaf lily__leaf--l"></div>
                    <div class="lily__stem"></div>
                </div>
                <div
                    class="lily lily--back"
                    style="
                        --stem-h: 160px;
                        --tilt: 33deg;
                        --base-x: 24px;
                        --layer: 0;
                        --sway-delay: -1.4s;
                    "
                >
                    <div class="lily__leaf lily__leaf--r"></div>
                    <div class="lily__stem"></div>
                </div>
                <div
                    class="tulip"
                    style="
                        --stem-h: 325px;
                        --tilt: -17deg;
                        --base-x: -18px;
                        --layer: 0;
                        --sway-delay: -1.8s;
                    "
                >
                    <div class="tulip__leaf tulip__leaf--l"></div>
                    <div class="tulip__leaf tulip__leaf--r"></div>
                    <div class="tulip__stem"></div>
                </div>
                <div
                    class="tulip"
                    style="
                        --stem-h: 305px;
                        --tilt: 22deg;
                        --base-x: 16px;
                        --layer: 0;
                        --sway-delay: -3.7s;
                    "
                >
                    <div class="tulip__leaf tulip__leaf--l"></div>
                    <div class="tulip__leaf tulip__leaf--r"></div>
                    <div class="tulip__stem"></div>
                </div>
                <div
                    class="tulip"
                    style="
                        --stem-h: 345px;
                        --tilt: 2deg;
                        --base-x: -2px;
                        --layer: 0;
                        --sway-delay: -0.9s;
                    "
                >
                    <div class="tulip__leaf tulip__leaf--l"></div>
                    <div class="tulip__leaf tulip__leaf--r"></div>
                    <div class="tulip__stem"></div>
                </div>

                <div
                    class="euca"
                    style="
                        --stem-h: 250px;
                        --tilt: -26deg;
                        --base-x: -26px;
                        --layer: 2;
                        --sway-delay: -1s;
                    "
                >
                    <div class="euca__stem"></div>
                    <div class="euca__leaf euca__leaf--1"></div>
                    <div class="euca__leaf euca__leaf--2"></div>
                    <div class="euca__leaf euca__leaf--3"></div>
                    <div class="euca__leaf euca__leaf--4"></div>
                    <div class="euca__leaf euca__leaf--5"></div>
                    <div class="euca__leaf euca__leaf--6"></div>
                    <div class="euca__leaf euca__leaf--7"></div>
                    <div class="euca__leaf euca__leaf--8"></div>
                </div>

                <div
                    class="euca"
                    style="
                        --stem-h: 220px;
                        --tilt: 29deg;
                        --base-x: 30px;
                        --layer: 2;
                        --sway-delay: -2.6s;
                    "
                >
                    <div class="euca__stem"></div>
                    <div class="euca__leaf euca__leaf--1"></div>
                    <div class="euca__leaf euca__leaf--2"></div>
                    <div class="euca__leaf euca__leaf--3"></div>
                    <div class="euca__leaf euca__leaf--4"></div>
                    <div class="euca__leaf euca__leaf--5"></div>
                    <div class="euca__leaf euca__leaf--6"></div>
                </div>

                <div
                    class="lily lily--md"
                    style="
                        --stem-h: 155px;
                        --tilt: -8deg;
                        --base-x: -14px;
                        --bloom-scale: 1.02;
                        --layer: 4;
                        --sway-delay: -3s;
                    "
                >
                    <div class="lily__bloom">
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal" style="--i: 0"></div>
                        <div class="petal" style="--i: 1"></div>
                        <div class="petal" style="--i: 2"></div>
                        <div class="petal" style="--i: 3"></div>
                        <div class="petal" style="--i: 4"></div>
                        <div class="petal" style="--i: 5"></div>
                    </div>
                    <div class="lily__stem"></div>
                </div>

                <div
                    class="lily lily--md"
                    style="
                        --stem-h: 160px;
                        --tilt: 33deg;
                        --base-x: 24px;
                        --bloom-scale: 0.9;
                        --layer: 2;
                        --sway-delay: -1.4s;
                    "
                >
                    <div class="lily__bloom">
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal" style="--i: 0"></div>
                        <div class="petal" style="--i: 1"></div>
                        <div class="petal" style="--i: 2"></div>
                        <div class="petal" style="--i: 3"></div>
                        <div class="petal" style="--i: 4"></div>
                        <div class="petal" style="--i: 5"></div>
                    </div>
                    <div class="lily__stem"></div>
                </div>

                <div
                    class="bloom3"
                    style="
                        --stem-h: 150px;
                        --tilt: -62deg;
                        --base-x: -32px;
                        --bloom-scale: 0.82;
                        --layer: 1;
                        --sway-delay: -3.4s;
                    "
                >
                    <div class="bloom3__stem"></div>
                    <div class="bloom3__core">
                        <div class="bloom3__glow"></div>
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal3" style="--i: 0"></div>
                        <div class="petal3" style="--i: 1"></div>
                        <div class="petal3" style="--i: 2"></div>
                        <div class="petal3" style="--i: 3"></div>
                        <div class="petal3" style="--i: 4"></div>
                        <div class="petal3" style="--i: 5"></div>
                    </div>
                </div>

                <div
                    class="bloom3"
                    style="
                        --stem-h: 186px;
                        --tilt: -35deg;
                        --base-x: -22px;
                        --bloom-scale: 1.05;
                        --layer: 2;
                        --sway-delay: -0.6s;
                    "
                >
                    <div class="bloom3__stem"></div>
                    <div class="bloom3__core">
                        <div class="bloom3__glow"></div>
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal3" style="--i: 0"></div>
                        <div class="petal3" style="--i: 1"></div>
                        <div class="petal3" style="--i: 2"></div>
                        <div class="petal3" style="--i: 3"></div>
                        <div class="petal3" style="--i: 4"></div>
                        <div class="petal3" style="--i: 5"></div>
                    </div>
                </div>

                <div
                    class="bloom3"
                    style="
                        --stem-h: 210px;
                        --tilt: 8deg;
                        --base-x: 6px;
                        --bloom-scale: 1.3;
                        --layer: 3;
                        --sway-delay: -4.2s;
                    "
                >
                    <div class="bloom3__stem"></div>
                    <div class="bloom3__core">
                        <div class="bloom3__glow"></div>
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal3" style="--i: 0"></div>
                        <div class="petal3" style="--i: 1"></div>
                        <div class="petal3" style="--i: 2"></div>
                        <div class="petal3" style="--i: 3"></div>
                        <div class="petal3" style="--i: 4"></div>
                        <div class="petal3" style="--i: 5"></div>
                    </div>
                </div>

                <div
                    class="bloom3"
                    style="
                        --stem-h: 138px;
                        --tilt: 48deg;
                        --base-x: 32px;
                        --bloom-scale: 0.8;
                        --layer: 1;
                        --sway-delay: -2s;
                    "
                >
                    <div class="bloom3__stem"></div>
                    <div class="bloom3__core">
                        <div class="bloom3__glow"></div>
                        <div class="stamens">
                            <div class="stamen" style="--i: 0"></div>
                            <div class="stamen" style="--i: 1"></div>
                            <div class="stamen" style="--i: 2"></div>
                            <div class="stamen" style="--i: 3"></div>
                            <div class="stamen" style="--i: 4"></div>
                            <div class="stamen" style="--i: 5"></div>
                        </div>
                        <div class="petal3" style="--i: 0"></div>
                        <div class="petal3" style="--i: 1"></div>
                        <div class="petal3" style="--i: 2"></div>
                        <div class="petal3" style="--i: 3"></div>
                        <div class="petal3" style="--i: 4"></div>
                        <div class="petal3" style="--i: 5"></div>
                    </div>
                </div>

                <div
                    class="tulip"
                    style="
                        --stem-h: 325px;
                        --tilt: -17deg;
                        --base-x: -18px;
                        --bloom-scale: 1;
                        --layer: 5;
                        --sway-delay: -1.8s;
                    "
                >
                    <div class="tulip__head">
                        <div class="tulip__petal tulip__petal--l"></div>
                        <div class="tulip__petal tulip__petal--r"></div>
                        <div class="tulip__petal tulip__petal--c"></div>
                    </div>
                </div>

                <div
                    class="tulip"
                    style="
                        --stem-h: 305px;
                        --tilt: 22deg;
                        --base-x: 16px;
                        --bloom-scale: 0.95;
                        --layer: 5;
                        --sway-delay: -3.7s;
                    "
                >
                    <div class="tulip__head">
                        <div class="tulip__petal tulip__petal--l"></div>
                        <div class="tulip__petal tulip__petal--r"></div>
                        <div class="tulip__petal tulip__petal--c"></div>
                    </div>
                </div>

                <div
                    class="tulip"
                    style="
                        --stem-h: 345px;
                        --tilt: 2deg;
                        --base-x: -2px;
                        --bloom-scale: 1.05;
                        --layer: 5;
                        --sway-delay: -0.9s;
                    "
                >
                    <div class="tulip__head">
                        <div class="tulip__petal tulip__petal--l"></div>
                        <div class="tulip__petal tulip__petal--r"></div>
                        <div class="tulip__petal tulip__petal--c"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
